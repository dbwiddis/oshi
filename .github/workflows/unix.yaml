# CI on Unix OS
name: Unix CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - nativefree-comparison-netbsd-run
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'

permissions:
  contents: read

jobs:
  testnetbsd:
    name: Test JDK 21, NetBSD (no JNA)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test in NetBSD
        id: test-netbsd
        uses: vmactions/netbsd-vm@20ee93a005c9fc78743e6e05269f4cb023b87413 # v1
        with:
          # See the FreeBSD job: caching a base image costs more than it saves. These also have
          # no pr.yaml counterpart, so nothing could restore them in the first place.
          disable-cache: true
          release: "10.1"
          usesh: true
          copyback: true
          prepare: |
            pkg_add curl
            pkg_add openjdk21
          run: |
            export JAVA_HOME=/usr/pkg/java/openjdk21
            export PATH=$JAVA_HOME/bin:$PATH
            mount -t procfs procfs /proc 2>/dev/null || true
            # jna-aggregate: JDK 21 aggregate report (oshi-common + oshi-core, no FFM) via oshi-demo.
            ./mvnw clean test -Pjna-aggregate -B
      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: oshi-demo/target/site/jacoco-aggregate/jacoco.xml
          flags: netbsd-nojna

  testnetbsdjna:
    name: Test JDK 25, NetBSD (JNA and FFM)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test in NetBSD
        id: test-netbsd-jna
        uses: vmactions/netbsd-vm@20ee93a005c9fc78743e6e05269f4cb023b87413 # v1
        with:
          # See the FreeBSD job: caching a base image costs more than it saves. These also have
          # no pr.yaml counterpart, so nothing could restore them in the first place.
          disable-cache: true
          release: "10.1"
          usesh: true
          copyback: true
          prepare: |
            pkg_add curl
            pkg_add java-jna
            # pkgsrc has no binary openjdk25 package yet; prefer it the moment it appears, and until then
            # use a pinned mirror of the pkgsrc-wip bootstrap JDK. A missing or altered file fails the job
            # rather than quietly dropping FFM coverage.
            if pkg_add openjdk25 2>/dev/null; then
              echo "using pkgsrc openjdk25"
            else
              BS=bootstrap-jdk-1.25.0.4.7-netbsd-9-amd64-20260908.tar.xz
              SHA=4587a19dea5edd24ccafb251221ee6177e788ae9ad6c0bf49be11ef900bbe7f75a0db77eb151edf12f8378aab8a7b9651043f31e98864317faf3ecb2533b34eb
              URL=https://github.com/dbwiddis/oshi/releases/download/netbsd-jdk25-bootstrap/$BS
              curl -sSfLo /tmp/$BS "$URL" || { echo "FATAL: could not fetch $URL"; exit 1; }
              [ "$(cksum -a sha512 -n /tmp/$BS | cut -d' ' -f1)" = "$SHA" ] || { echo "FATAL: checksum mismatch for $BS"; exit 1; }
              mkdir -p /opt && tar -xJf /tmp/$BS -C /opt
              echo "using the bootstrap JDK mirror"
            fi
          run: |
            if [ -d /usr/pkg/java/openjdk25 ]; then
              export JAVA_HOME=/usr/pkg/java/openjdk25
            else
              export JAVA_HOME=/opt/bootstrap
              # The bootstrap kit's RPATH points at the pkgsrc prefix it was built for
              export LD_LIBRARY_PATH=$JAVA_HOME/lib:$JAVA_HOME/lib/server
            fi
            export PATH=$JAVA_HOME/bin:$PATH
            # Point JNA at the pkgsrc libjnidispatch, so both implementations run natively
            export JAVA_TOOL_OPTIONS="-Djna.boot.library.path=/usr/pkg/lib"
            mount -t procfs procfs /proc 2>/dev/null || true
            # aggregate-coverage: oshi-common + oshi-core + oshi-core-ffm, and the oshi.comparison tests
            ./mvnw clean test -Paggregate-coverage -B
      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: oshi-benchmark/target/site/jacoco-aggregate/jacoco.xml
          flags: netbsd
