name: ARM64 Windows check
on: push
permissions:
  contents: read
jobs:
  winarm:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 25
      - shell: pwsh
        run: |
          ./mvnw -B -q install -DskipTests "-Dmaven.gitcommitid.skip=true" "-Djacoco.skip=true" "-Ddependency-check.skip=true" "-Dmaven.javadoc.skip=true" -pl oshi-core,oshi-core-ffm -am
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList '/c','mvnw.cmd -B -q exec:java -pl oshi-core -Dexec.mainClass=oshi.SystemInfoTest -Dexec.classpathScope=test -Dmaven.gitcommitid.skip=true > jna.txt 2>&1' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(240000)) {
            echo "=== STILL RUNNING after 4 min; thread dumps:"
            Get-Process java -ErrorAction SilentlyContinue | ForEach-Object { & "$env:JAVA_HOME\bin\jstack.exe" $_.Id }
            Stop-Process -Id $p.Id -Force
            Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          echo "=== JNA OUTPUT (head)"; Get-Content jna.txt -TotalCount 120
