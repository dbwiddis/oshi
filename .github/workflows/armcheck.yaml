name: ARM64 Windows check
on: push
permissions:
  contents: read
jobs:
  winarm:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 25
      - shell: pwsh
        run: |
          ./mvnw -B install -DskipTests "-Dmaven.gitcommitid.skip=true" "-Djacoco.skip=true" "-Ddependency-check.skip=true" "-Dmaven.javadoc.skip=true" -pl oshi-core,oshi-core-ffm -am
          ./mvnw -B -q exec:java -pl oshi-core "-Dexec.mainClass=oshi.SystemInfoTest" "-Dexec.classpathScope=test" "-Dmaven.gitcommitid.skip=true" | Select-String -Pattern "Processor|Identifier|ProcessorID|Stepping|Family|Microarch|Model" | Select-Object -First 15
          ./mvnw -B -q exec:java -pl oshi-core-ffm "-Dexec.mainClass=oshi.ffm.SystemInfoTest" "-Dexec.classpathScope=test" "-Dmaven.gitcommitid.skip=true" | Select-String -Pattern "Processor|Identifier|ProcessorID|Stepping|Family|Microarch|Model" | Select-Object -First 15
